[workspace]
members = ["crates/trixelate", "crates/trixelate-cli", "crates/trixelate-web"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Maeevick/trixelate"

[workspace.dependencies]
trixelate = { path = "crates/trixelate", version = "0.3.2" }

[profile.dev.package."*"]
opt-level = 3

[profile.web]
inherits = "dev"

[profile.web.package."*"]
opt-level = 3

[profile.web.package.trixelate]
opt-level = 3

# One unit, linked whole: a smaller, slightly faster command line.
[profile.release]
lto = true
codegen-units = 1

# The page's release, sized for the network: 14% less gzipped wasm than opt-level 3 with the same linking, 7% slower
# to paint a sheet.
[profile.web-release]
inherits = "release"
opt-level = "s"
