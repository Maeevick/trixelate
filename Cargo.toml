[workspace]
members = ["crates/trixelate", "crates/trixelate-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Maeevick/trixelate"

[workspace.dependencies]
trixelate = { path = "crates/trixelate", version = "0.1.0" }

[profile.dev.package."*"]
opt-level = 3
