[package]
name = "trixelate-cli"
description = "The command line that turns a picture into a colour-by-number pixel sheet, ready to print"
readme = "../../README.md"
keywords = ["pixel-art", "colouring", "paint-by-number", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trixelate"
path = "src/main.rs"

[dependencies]
trixelate.workspace = true
clap = { version = "4", features = ["derive"] }
