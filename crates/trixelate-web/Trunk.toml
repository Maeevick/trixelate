[build]
target = "index.html"
dist = "dist"
# Relative links, so the page works from any folder, a GitHub Pages project site included.
public_url = "./"

[tools]
tailwindcss = "4.3.5"

# The release page's Content-Security-Policy, hashing what Trunk writes inline: see crates/trixelate-csp.
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--quiet", "--locked", "-p", "trixelate-csp"]
