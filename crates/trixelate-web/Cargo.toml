[package]
name = "trixelate-web"
description = "The browser page that turns a picture into a colour-by-number pixel sheet, with no server"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
trixelate.workspace = true
console_error_panic_hook = "0.1"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "DataTransfer",
  "DomRect",
  "DragEvent",
  "Element",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlInputElement",
  "PointerEvent",
  "Url",
] }
